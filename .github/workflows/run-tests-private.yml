name: Run tests

on:
  push:
    branches:
      - master
      - 'stable-*'
      - 'dev-*'
  pull_request:
  workflow_dispatch:

jobs:
  linux-build:
    name: Linux build
    if: github.repository == 'AdGuardSoftwareLimited/trusttunnel-endpoint'
    runs-on: [team-corelibs]
    permissions:
      contents: read
      id-token: write
    env:
      # sccache local-disk store, restored/saved across runs by the
      # registry-cache action as an OCI registry blob.
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 512M
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure sccache
        uses: AdguardTeam/sccache-action@main

      - name: Restore sccache store
        uses: AdGuardSoftwareLimited/actions/actions/registry-cache/restore@master
        with:
          config: ${{ secrets.REGISTRY_CACHE_AUTH }}
          key: sccache-linux
          path: ${{ env.SCCACHE_DIR }}

      - name: Run tests in Docker
        run: |
          set -euxo pipefail

          rm -rf build
          cat > Dockerfile <<'EOF'
          # syntax=docker/dockerfile:1
          FROM adguard/core-libs:2.10 AS build

          # sccache caches the Rust compilations. The pinned binary is
          # installed once: this layer depends only on the base image, so it
          # stays cached across runs (the native-tests stage is rebuilt by
          # --no-cache-filter, this one is not).
          RUN curl -fsSL https://github.com/mozilla/sccache/releases/download/v0.17.0/sccache-v0.17.0-x86_64-unknown-linux-musl.tar.gz \
              | tar -xz -C /usr/local/bin --strip-components=1

          WORKDIR /src
          COPY . .

          FROM build AS native-tests

          RUN <<END
          set -eux

          # The store was restored into .sccache and copied here by COPY . .;
          # RUSTC_WRAPPER makes cargo use sccache for the rustc invocations.
          # Lints run without the wrapper (clippy is analysis, not cached
          # object code), so it is exported only for the test/build steps.
          # CARGO_INCREMENTAL=0: sccache is incompatible with incremental
          # compilation (it would bypass the cache).
          export SCCACHE_DIR=/src/.sccache
          export CARGO_INCREMENTAL=0

          mkdir -p /src/results
          (rustup component add rustfmt clippy \
              && make lint-rust \
              && export RUSTC_WRAPPER=sccache \
              && cargo test --workspace \
              && cargo build --bins) || test_status=$?

          echo "${test_status:-0}" > /src/results/test-status

          exit 0
          END

          FROM scratch AS native-tests-output

          COPY --from=native-tests /src/results/test-status /test-status
          COPY --from=native-tests /src/.sccache /sccache
          EOF
          DOCKER_BUILDKIT=1 docker build --progress=plain \
            --no-cache-filter native-tests \
            --target native-tests-output \
            --output type=local,dest=build \
            -f Dockerfile .

          test "$(cat build/test-status)" -eq 0

      - name: sccache stats
        id: sccache-stats
        if: always()
        run: |
          SCCACHE_DIR=build/sccache sccache --show-stats || true
          cache_writes=$(SCCACHE_DIR=build/sccache sccache --show-stats --stats-format=json 2>/dev/null \
            | grep -o '"cache_writes":[0-9]*' | grep -o '[0-9]*' || echo 0)
          if [ "$cache_writes" -gt 0 ] 2>/dev/null; then
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save sccache store
        if: always()
        uses: AdGuardSoftwareLimited/actions/actions/registry-cache/save@master
        with:
          config: ${{ secrets.REGISTRY_CACHE_AUTH }}
          key: sccache-linux
          path: build/sccache
          force: ${{ steps.sccache-stats.outputs.force }}

  mac-build:
    name: Mac build
    if: github.repository == 'AdGuardSoftwareLimited/trusttunnel-endpoint'
    runs-on:
      - ephemeral
      - ephemeral-mac
      - ${{ vars.BUILD_IMAGE_VERSION_MACOS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run tests
        run: cargo test --workspace
      - name: Build binaries
        run: cargo build --bins
