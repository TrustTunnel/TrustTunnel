name: CI Build

on:
  push:
    branches:
      - "*"
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  build:
    name: Build workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build debug binaries
        run: |
          cargo build --bins

      - name: Build release binaries
        run: |
          cargo build --bins --release

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-binaries
          path: target/debug/trusttunnel_endpoint
          retention-days: 30

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-binaries
          path: target/release/trusttunnel_endpoint
          retention-days: 30

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ github.run_id }}
          release_name: Build ${{ github.run_number }} (run ${{ github.run_id }})
          draft: false
          prerelease: false

      - name: Upload release binary (release)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: target/release/trusttunnel_endpoint
          asset_name: trusttunnel_endpoint-release
          asset_content_type: application/octet-stream

      - name: Upload release binary (debug)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: target/debug/trusttunnel_endpoint
          asset_name: trusttunnel_endpoint-debug
          asset_content_type: application/octet-stream
