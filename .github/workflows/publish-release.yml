name: Publish release

# Publishes a release end to end. It runs once a release-bump PR (opened by
# prepare-release.yml) is merged, or on manual dispatch.
#
#   1. Reads the released version from CHANGELOG.md and creates the v{version}
#      tag (tag-from-changelog.yml). That workflow only proceeds for a merged
#      release-bump PR (or manual dispatch), so it gates every downstream job --
#      no extra `if` is needed here.
#   2. Builds the Linux (musl) and macOS binaries from the tagged commit, with
#      the released version injected via TRUSTTUNNEL_VERSION (see build.rs).
#   3. Publishes the GitHub Release on the public mirror (TrustTunnel/TrustTunnel)
#      with the changelog notes and the signed archives attached.

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to publish manually (SHA or branch)'
        required: false
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  pull-requests: read

jobs:
  # 1. Read the released version from CHANGELOG.md and create the v{version} tag.
  # tag-from-changelog only proceeds for a merged release-bump/* PR (or manual
  # dispatch), so every downstream job is gated by `needs: tag`.
  tag:
    name: Tag from changelog
    if: github.repository == 'AdGuardSoftwareLimited/trusttunnel-endpoint'
    uses: AdGuardSoftwareLimited/actions/.github/workflows/tag-from-changelog.yml@master
    with:
      team: corelibs
      ref: ${{ inputs.ref || github.event.pull_request.merge_commit_sha || '' }}
    secrets: inherit

  # 2a. Build the Linux (musl x86_64 + aarch64) binaries.
  build:
    name: Build Linux artifacts
    needs: tag
    runs-on:
      - ephemeral
      - ephemeral-linux
      - ${{ vars.BUILD_IMAGE_VERSION_CORELIBS_BUILDER }}
      - ephemeral-limit-memory-8192
      - ephemeral-limit-cpu-6
    container:
      image: adguard/core-libs:2.10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Retrieve GPG signing secrets
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_URL }}
          method: jwt
          role: gpg-signing
          secrets: |
            secret/data/ci-secrets/gpg-signing gpgSecretKey | GPG_SECRET_KEY ;
            secret/data/ci-secrets/gpg-signing gpgPassword | GPG_PASSWORD

      - name: Build and package
        env:
          TRUSTTUNNEL_VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -e -x

          # Build x86_64 musl
          CC=x86_64-linux-musl-gcc \
          CXX=x86_64-linux-musl-g++ \
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=x86_64-linux-musl-gcc \
          BINDGEN_EXTRA_CLANG_ARGS="--sysroot=/opt/cross/x86_64-linux-musl" \
          cargo build --release --target x86_64-unknown-linux-musl

          # Build aarch64 musl
          CC=aarch64-linux-musl-gcc \
          CXX=aarch64-linux-musl-g++ \
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc \
          BINDGEN_EXTRA_CLANG_ARGS="--sysroot=/opt/cross/aarch64-linux-musl" \
          cargo build --release --target aarch64-unknown-linux-musl

          # Package: strip, split debug symbols, GPG sign, tar.gz
          scripts/ci/package_release.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: artifacts/*.tar.gz

  # 2b. Build the macOS (universal) binaries.
  build-macos:
    name: Build macOS artifacts
    needs: tag
    runs-on:
      - ephemeral
      - ephemeral-mac
      - ${{ vars.BUILD_IMAGE_VERSION_MACOS }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Retrieve GPG signing secrets
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_URL }}
          method: jwt
          role: gpg-signing
          secrets: |
            secret/data/ci-secrets/gpg-signing gpgSecretKey | GPG_SECRET_KEY ;
            secret/data/ci-secrets/gpg-signing gpgPassword | GPG_PASSWORD

      - name: Build and package
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          TRUSTTUNNEL_VERSION: ${{ needs.tag.outputs.version }}
          GPG_KEY: devteam@adguard.com
        run: |
          set -e -x

          echo "$GPG_SECRET_KEY" | gpg --import --batch --yes

          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin

          mkdir -p artifacts
          NAME="trusttunnel-v${VERSION}-macos-universal"

          lipo -create \
            -output trusttunnel_endpoint \
            target/x86_64-apple-darwin/release/trusttunnel_endpoint \
            target/aarch64-apple-darwin/release/trusttunnel_endpoint

          lipo -create \
            -output setup_wizard \
            target/x86_64-apple-darwin/release/setup_wizard \
            target/aarch64-apple-darwin/release/setup_wizard

          dsymutil trusttunnel_endpoint -o trusttunnel_endpoint.dSYM
          dsymutil setup_wizard -o setup_wizard.dSYM

          strip trusttunnel_endpoint
          strip setup_wizard

          gpg --default-key "${GPG_KEY}" --detach-sig \
              --passphrase "${GPG_PASSWORD}" --pinentry-mode loopback \
              trusttunnel_endpoint
          gpg --default-key "${GPG_KEY}" --detach-sig \
              --passphrase "${GPG_PASSWORD}" --pinentry-mode loopback \
              setup_wizard

          tar zcf "${NAME}.tar.gz" -s ",^,${NAME}/," \
            trusttunnel_endpoint trusttunnel_endpoint.sig \
            setup_wizard setup_wizard.sig LICENSE
          mv "${NAME}.tar.gz" artifacts/

          NAME_DBG="${NAME}-dbgsym"
          tar zcf "${NAME_DBG}.tar.gz" -s ",^,${NAME_DBG}/," \
            trusttunnel_endpoint.dSYM setup_wizard.dSYM
          mv "${NAME_DBG}.tar.gz" artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: artifacts/trusttunnel-*.tar.gz

  # 3. Publish the GitHub Release on the public mirror, attaching the Linux and
  # macOS archives collected above. Pre-release tags (v...-beta.N, -rc.N) are
  # marked as pre-releases.
  # 3. Collect the Linux and macOS archives into a single `release-artifacts`
  # artifact (create-gh-release.yml downloads a single named artifact), then
  # publish the GitHub Release on the public mirror with the changelog notes.
  collect:
    name: Collect release artifacts
    needs: [build, build-macos]
    if: github.repository == 'AdGuardSoftwareLimited/trusttunnel-endpoint'
    runs-on: [team-corelibs]
    permissions:
      contents: read
    steps:
      - name: Download all platform archives
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Upload combined release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: artifacts/trusttunnel-*.tar.gz
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [tag, collect]
    if: github.repository == 'AdGuardSoftwareLimited/trusttunnel-endpoint'
    uses: AdGuardSoftwareLimited/actions/.github/workflows/create-gh-release.yml@master
    with:
      team: corelibs
      target_repo: TrustTunnel/TrustTunnel
      tag_name: ${{ needs.tag.outputs.tag }}
      body: ${{ needs.tag.outputs.changelog }}
      artifact_name: release-artifacts
      prerelease: ${{ contains(needs.tag.outputs.tag, '-') }}
      environment: release-github
    secrets: inherit
