apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ default .Chart.Name .Values.fullnameOverride }}
  labels:
    app.kubernetes.io/name: trusttunnel
    app.kubernetes.io/part-of: trusttunnel-classic
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: trusttunnel
      app.kubernetes.io/part-of: trusttunnel-classic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trusttunnel
        app.kubernetes.io/part-of: trusttunnel-classic
    spec:
      shareProcessNamespace: {{ .Values.sidecarEnabled }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.nodeAffinity }}
        nodeAffinity:
          {{- toYaml .Values.nodeAffinity | nindent 10 }}
        {{- end }}
        {{- if .Values.podAntiAffinity }}
        podAntiAffinity:
          {{- toYaml .Values.podAntiAffinity | nindent 10 }}
        {{- end }}
      containers:
        - name: trusttunnel_endpoint
          image: "{{ .Values.endpoint.image.repository }}:{{ .Values.endpoint.image.tag }}"
          imagePullPolicy: {{ .Values.endpoint.image.pullPolicy }}
          args:
            {{- toYaml .Values.endpoint.args | nindent 12 }}
          ports:
            - name: https-tcp
              containerPort: {{ .Values.endpoint.service.targetPort }}
              protocol: TCP
            - name: https-udp
              containerPort: {{ .Values.endpoint.service.targetPort }}
              protocol: UDP
          readinessProbe:
            tcpSocket:
              port: https-tcp
            initialDelaySeconds: {{ .Values.endpoint.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.endpoint.readiness.periodSeconds }}
            failureThreshold: {{ .Values.endpoint.readiness.failureThreshold }}
          livenessProbe:
            tcpSocket:
              port: https-tcp
            initialDelaySeconds: {{ .Values.endpoint.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.endpoint.liveness.periodSeconds }}
            failureThreshold: {{ .Values.endpoint.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources.endpoint | nindent 12 }}
          volumeMounts:
            - name: runtime
              mountPath: /runtime
        {{- if .Values.sidecarEnabled }}
        - name: trusttunnel_sidecar_agent
          image: "{{ .Values.sidecar.image.repository }}:{{ .Values.sidecar.image.tag }}"
          imagePullPolicy: {{ .Values.sidecar.image.pullPolicy }}
          ports:
            - name: agent-http
              containerPort: {{ .Values.sidecar.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: agent-http
            initialDelaySeconds: {{ .Values.sidecar.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.sidecar.readiness.periodSeconds }}
            failureThreshold: {{ .Values.sidecar.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: agent-http
            initialDelaySeconds: {{ .Values.sidecar.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.sidecar.liveness.periodSeconds }}
            failureThreshold: {{ .Values.sidecar.liveness.failureThreshold }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecretName }}
          env:
            - name: LK_INTERNAL_BASE_URL
              value: {{ .Values.lkBaseUrl | quote }}
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SYNC_INTERVAL_SECONDS
              value: {{ .Values.syncIntervalSeconds | quote }}
            - name: HEARTBEAT_INTERVAL_SECONDS
              value: {{ .Values.heartbeatIntervalSeconds | quote }}
            - name: CREDENTIALS_PATH
              value: {{ .Values.runtime.credentialsPath | quote }}
            - name: TRUSTTUNNEL_RELOAD_MODE
              value: {{ .Values.runtime.trustTunnelReloadMode | quote }}
            - name: TRUSTTUNNEL_PID
              value: {{ .Values.runtime.trustTunnelPid | quote }}
            - name: AGENT_PORT
              value: {{ .Values.sidecar.port | quote }}
            - name: TRUSTTUNNEL_TCP_ADDR
              value: {{ .Values.runtime.trustTunnelTcpAddr | quote }}
          resources:
            {{- toYaml .Values.resources.sidecar | nindent 12 }}
          volumeMounts:
            - name: runtime
              mountPath: /runtime
        {{- end }}
      volumes:
        - name: runtime
          emptyDir: {}
