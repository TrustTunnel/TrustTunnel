{{- if and .Values.sidecarEnabled .Values.sidecar.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ default (printf "%s-sidecar" (default .Chart.Name .Values.fullnameOverride)) .Values.sidecar.rbac.roleName }}
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.sidecar.serviceAccountName | default (default .Chart.Name .Values.fullnameOverride) }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ default (printf "%s-sidecar" (default .Chart.Name .Values.fullnameOverride)) .Values.sidecar.rbac.roleName }}
{{- end }}
