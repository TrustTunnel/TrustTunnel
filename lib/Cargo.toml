[package]
name = "trusttunnel"
version = "0.1.0"
authors = ["Sergei Gunchenko <s.gunchenko@adguard.com>"]
edition = "2021"

[lib]
name = "trusttunnel"
path = "src/lib.rs"
doctest = false

[build-dependencies]
cc = "1.0.79"

[dependencies]
async-trait = "0.1.68"
base64 = "0.21.2"
tls-parser = "0.12.2"
bytes = "1.4.0"
chrono = { version = "0.4.26", default-features = false, features = ["clock"] }
dynfmt = { version = "0.1.5", features = ["curly"], default-features = false }
futures = "0.3.28"
h2 = "0.3.26"
hex = "0.4.3"
http = "0.2.9"
httparse = "1.8.0"
ipnet = "2.9"
lazy_static = "1.4.0"
libc = "0.2.147"
log = "0.4.19"
macros = { version = "0.1.0", path = "../macros", optional = true }
once_cell = "1.18.0"
prometheus = { version = "0.14", features = ["process"] }
quiche = { version = "0.24.5", features = ["qlog", "boringssl-boring-crate"] }
rand = "0.8"
ring = "0.17.12"
rustls = { version = "0.23.37", features = ["logging"] }
rustls-native-certs = "0.7"
rustls-pki-types = "1.13.2"
serde = "1.0.164"
serde_json = "1.0"
smallvec = "1.10.0"
socket2 = "0.5"
tokio = { version = "1.42", features = ["net", "rt", "sync", "time", "macros", "rt-multi-thread"] }
tokio-rustls = "0.26"
toml_edit = "0.19.10"
boring = "4"
trusttunnel-deeplink = { path = "../deeplink" }

[dev-dependencies]
hyper = { version = "0.14.26", features = ["http1", "http2", "client", "server", "runtime", "stream"] }
rustls = { version = "0.23.37", features = ["logging"] }
tempfile = "3"
toml = { version = "0.7.4", default-features = false, features = ["parse"] }

[features]
rt_doc = ["dep:macros"]
tracing = ["tokio/tracing"]
default = ["rt_doc"]
